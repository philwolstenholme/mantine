<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>useWindowScroll Optimization Comparison</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 400vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      z-index: 100;
    }

    h1 {
      color: #1a202c;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #718096;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .hook-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .hook-card.optimized {
      border: 3px solid #48bb78;
    }

    .hook-card.original {
      border: 3px solid #f56565;
    }

    .hook-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge.optimized {
      background: #48bb78;
      color: white;
    }

    .badge.original {
      background: #f56565;
      color: white;
    }

    .metrics {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f7fafc;
      border-radius: 6px;
    }

    .metric-label {
      font-size: 13px;
      color: #4a5568;
      font-weight: 500;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .metric-value.optimized {
      color: #48bb78;
    }

    .metric-value.original {
      color: #f56565;
    }

    .scroll-position {
      background: #edf2f7;
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #2d3748;
    }

    .instructions {
      background: #fff5e6;
      border-left: 4px solid #f6ad55;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .instructions h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #744210;
    }

    .instructions ul {
      margin-left: 20px;
      color: #744210;
      font-size: 13px;
    }

    .instructions li {
      margin-bottom: 4px;
    }

    .savings {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .savings h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .savings-value {
      font-size: 48px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
    }

    .savings-label {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .content-blocks {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .content-block {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .content-block h2 {
      color: #2d3748;
      margin-bottom: 15px;
    }

    .content-block p {
      color: #4a5568;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .comparison-grid {
        grid-template-columns: 1fr;
      }
    }

    .reset-btn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:hover {
      background: #3182ce;
    }

    .reset-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ============================================================
    // OPTIMIZED VERSION (Your PR #8574)
    // ============================================================
    function useWindowScrollOptimized() {
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const frameID = useRef(null);

      // Track metrics
      const metrics = useRef({
        renders: 0,
        setStateCalls: 0,
        callbackCalls: 0,
        rafScheduled: 0,
        rafExecuted: 0,
        skippedDuplicates: 0,
        stateUpdatesSkipped: 0
      });

      // Increment render counter
      metrics.current.renders++;

      const getScrollPosition = () => {
        return typeof window !== 'undefined'
          ? { x: window.scrollX, y: window.scrollY }
          : { x: 0, y: 0 };
      };

      const handleScroll = useCallback(() => {
        metrics.current.callbackCalls++;

        if (frameID.current !== null) {
          metrics.current.skippedDuplicates++;
          return;
        }

        metrics.current.rafScheduled++;
        frameID.current = requestAnimationFrame(() => {
          frameID.current = null;
          metrics.current.rafExecuted++;

          setPosition((prev) => {
            metrics.current.setStateCalls++;
            const next = getScrollPosition();

            if (prev.x === next.x && prev.y === next.y) {
              metrics.current.stateUpdatesSkipped++;
              return prev;
            }

            return next;
          });
        });
      }, []);

      useEffect(() => {
        const handleEvent = handleScroll;

        window.addEventListener('scroll', handleEvent, { passive: true });
        window.addEventListener('resize', handleEvent, { passive: true });

        setPosition(getScrollPosition());

        return () => {
          window.removeEventListener('scroll', handleEvent);
          window.removeEventListener('resize', handleEvent);
          if (frameID.current !== null) {
            cancelAnimationFrame(frameID.current);
          }
        };
      }, [handleScroll]);

      return [position, metrics.current];
    }

    // ============================================================
    // ORIGINAL VERSION (Current Mantine master)
    // ============================================================
    function useWindowScrollOriginal() {
      const [position, setPosition] = useState({ x: 0, y: 0 });

      // Track metrics
      const metrics = useRef({
        renders: 0,
        setStateCalls: 0,
        callbackCalls: 0,
        rafScheduled: 0,
        rafExecuted: 0,
        skippedDuplicates: 0,
        stateUpdatesSkipped: 0
      });

      // Increment render counter
      metrics.current.renders++;

      const getScrollPosition = () => {
        return typeof window !== 'undefined'
          ? { x: window.scrollX, y: window.scrollY }
          : { x: 0, y: 0 };
      };

      useEffect(() => {
        const handleScroll = () => {
          metrics.current.callbackCalls++;
          metrics.current.setStateCalls++;
          setPosition(getScrollPosition());
        };

        window.addEventListener('scroll', handleScroll); // No passive
        window.addEventListener('resize', handleScroll); // No passive

        setPosition(getScrollPosition());

        return () => {
          window.removeEventListener('scroll', handleScroll);
          window.removeEventListener('resize', handleScroll);
        };
      }, []);

      return [position, metrics.current];
    }

    // ============================================================
    // ISOLATED COMPONENTS (prevents cross-contamination)
    // ============================================================
    function OptimizedTracker({ onUpdate }) {
      const [position, metrics] = useWindowScrollOptimized();

      useEffect(() => {
        onUpdate({ position, metrics });
      });

      return null; // Renders nothing
    }

    function OriginalTracker({ onUpdate }) {
      const [position, metrics] = useWindowScrollOriginal();

      useEffect(() => {
        onUpdate({ position, metrics });
      });

      return null; // Renders nothing
    }

    // ============================================================
    // COMPARISON COMPONENT (Display only, no hooks)
    // ============================================================
    function ScrollComparison() {
      const [optimizedData, setOptimizedData] = useState({
        position: { x: 0, y: 0 },
        metrics: { renders: 0, setStateCalls: 0, callbackCalls: 0, rafScheduled: 0, rafExecuted: 0, skippedDuplicates: 0, stateUpdatesSkipped: 0 }
      });
      const [originalData, setOriginalData] = useState({
        position: { x: 0, y: 0 },
        metrics: { renders: 0, setStateCalls: 0, callbackCalls: 0, rafScheduled: 0, rafExecuted: 0, skippedDuplicates: 0, stateUpdatesSkipped: 0 }
      });
      const [, forceUpdate] = useState({});

      const resetCounters = () => {
        optimizedData.metrics.renders = 0;
        optimizedData.metrics.setStateCalls = 0;
        optimizedData.metrics.callbackCalls = 0;
        optimizedData.metrics.rafScheduled = 0;
        optimizedData.metrics.rafExecuted = 0;
        optimizedData.metrics.skippedDuplicates = 0;
        optimizedData.metrics.stateUpdatesSkipped = 0;

        originalData.metrics.renders = 0;
        originalData.metrics.setStateCalls = 0;
        originalData.metrics.callbackCalls = 0;
        originalData.metrics.rafScheduled = 0;
        originalData.metrics.rafExecuted = 0;
        originalData.metrics.skippedDuplicates = 0;
        originalData.metrics.stateUpdatesSkipped = 0;

        forceUpdate({});
      };

      const metricsOptimized = optimizedData.metrics;
      const metricsOriginal = originalData.metrics;
      const positionOptimized = optimizedData.position;
      const positionOriginal = originalData.position;

      const rendersSaved = metricsOriginal.renders - metricsOptimized.renders;
      const setStateSaved = metricsOriginal.setStateCalls - metricsOptimized.setStateCalls;
      const savingsPercent = metricsOriginal.renders > 0
        ? ((rendersSaved / metricsOriginal.renders) * 100).toFixed(1)
        : '0.0';

      return (
        <div className="container">
          {/* Isolated hook trackers - prevent cross-contamination */}
          <OptimizedTracker onUpdate={setOptimizedData} />
          <OriginalTracker onUpdate={setOriginalData} />

          <div className="sticky-header">
            <h1>🚀 useWindowScroll Optimization Comparison</h1>
            <p className="subtitle">PR #8574 vs Current Mantine Implementation</p>

            <div className="instructions">
              <h3>📋 How to test:</h3>
              <ul>
                <li>Scroll up and down this page normally</li>
                <li>Try scrolling past the top/bottom boundaries (overscroll)</li>
                <li>On mobile: use momentum scrolling and elastic bounce</li>
                <li>Resize your browser window</li>
                <li>Watch the counters update in real-time</li>
              </ul>
            </div>

            <div style={{ marginBottom: '20px', textAlign: 'center' }}>
              <button className="reset-btn" onClick={resetCounters}>
                🔄 Reset Counters
              </button>
            </div>

            <div className="comparison-grid">
              {/* OPTIMIZED VERSION */}
              <div className="hook-card optimized">
                <div className="hook-title">
                  <span>✨ Optimized (PR #8574)</span>
                  <span className="badge optimized">Your Version</span>
                </div>
                <div className="metrics">
                  <div className="metric">
                    <span className="metric-label">Component Renders</span>
                    <span className="metric-value optimized">{metricsOptimized.renders}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">setState Calls</span>
                    <span className="metric-value optimized">{metricsOptimized.setStateCalls}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Event Callbacks</span>
                    <span className="metric-value optimized">{metricsOptimized.callbackCalls}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">RAF Scheduled</span>
                    <span className="metric-value optimized">{metricsOptimized.rafScheduled}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">RAF Executed</span>
                    <span className="metric-value optimized">{metricsOptimized.rafExecuted}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Skipped (Deduplication)</span>
                    <span className="metric-value optimized">{metricsOptimized.skippedDuplicates}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Skipped (Equality Check)</span>
                    <span className="metric-value optimized">{metricsOptimized.stateUpdatesSkipped}</span>
                  </div>
                </div>
                <div className="scroll-position">
                  Position: ({positionOptimized.x}, {positionOptimized.y})
                </div>
              </div>

              {/* ORIGINAL VERSION */}
              <div className="hook-card original">
                <div className="hook-title">
                  <span>📦 Original (Master)</span>
                  <span className="badge original">Current</span>
                </div>
                <div className="metrics">
                  <div className="metric">
                    <span className="metric-label">Component Renders</span>
                    <span className="metric-value original">{metricsOriginal.renders}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">setState Calls</span>
                    <span className="metric-value original">{metricsOriginal.setStateCalls}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Event Callbacks</span>
                    <span className="metric-value original">{metricsOriginal.callbackCalls}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">RAF Scheduled</span>
                    <span className="metric-value original">{metricsOriginal.rafScheduled}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">RAF Executed</span>
                    <span className="metric-value original">{metricsOriginal.rafExecuted}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Skipped (Deduplication)</span>
                    <span className="metric-value original">{metricsOriginal.skippedDuplicates}</span>
                  </div>
                  <div className="metric">
                    <span className="metric-label">Skipped (Equality Check)</span>
                    <span className="metric-value original">{metricsOriginal.stateUpdatesSkipped}</span>
                  </div>
                </div>
                <div className="scroll-position">
                  Position: ({positionOriginal.x}, {positionOriginal.y})
                </div>
              </div>
            </div>

            <div className="savings">
              <h3>💰 Performance Savings</h3>
              <div className="savings-value">{rendersSaved}</div>
              <div className="savings-label">
                Fewer renders ({savingsPercent}% reduction)
              </div>
              <div style={{ marginTop: '15px', fontSize: '14px' }}>
                {setStateSaved} fewer setState calls
              </div>
            </div>
          </div>

          <div className="content-blocks">
            <div className="content-block">
              <h2>Why This Matters</h2>
              <p>
                The optimized version uses requestAnimationFrame to batch scroll updates,
                preventing excessive re-renders during high-frequency scroll events.
                The equality check prevents re-renders when scroll position hasn't changed
                (common at document boundaries and during momentum scrolling).
              </p>
            </div>

            <div className="content-block">
              <h2>Key Optimizations</h2>
              <p>
                <strong>1. RAF Deduplication:</strong> Prevents multiple animation frames from being scheduled
                in the same frame period.<br/><br/>
                <strong>2. Equality Check:</strong> Skips state updates when position hasn't changed,
                eliminating wasted re-renders at scroll boundaries.<br/><br/>
                <strong>3. Passive Listeners:</strong> Allows browser to optimize scrolling performance
                by not blocking on event handlers.
              </p>
            </div>

            <div className="content-block">
              <h2>Test Scenarios</h2>
              <p>
                <strong>Normal Scrolling:</strong> Moderate savings from RAF batching.<br/><br/>
                <strong>Boundary Overscroll:</strong> Huge savings! The original fires setState on every
                event even when position is stuck at 0 or max. Your version skips all of these.<br/><br/>
                <strong>Window Resize:</strong> Original triggers scroll updates even when position doesn't change.
                Optimized version skips these entirely.
              </p>
            </div>

            <div className="content-block">
              <h2>Keep Scrolling...</h2>
              <p>
                This page is intentionally tall (400vh) so you can test various scroll behaviors.
                Try scrolling to the very top or bottom and keep trying to scroll further—watch
                how the "Skipped (Equality Check)" counter climbs in the optimized version while
                the original keeps re-rendering unnecessarily!
              </p>
            </div>

            <div className="content-block" style={{ background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: 'white' }}>
              <h2 style={{ color: 'white' }}>End of Content</h2>
              <p style={{ color: 'rgba(255,255,255,0.9)' }}>
                Scroll back to the top to see your performance savings!
                The sticky header will stay visible so you can monitor the metrics.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // RENDER APP
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ScrollComparison />);
  </script>
</body>
</html>
